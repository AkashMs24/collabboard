name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm install
      - run: node --check src/index.js
      - run: node --check src/controllers/authController.js
      - run: node --check src/controllers/boardController.js
      - run: node --check src/controllers/taskController.js
      - run: npm test
      - run: echo "Server checks OK"

  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm install
      - run: npm run build
      - run: echo "Client build OK"

  e2e:
    name: E2E real-time sync
    runs-on: ubuntu-latest
    needs: [server, client]
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collabboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/collabboard_test
      JWT_SECRET: e2e_test_jwt_secret
      JWT_REFRESH_SECRET: e2e_test_refresh_secret
      CLIENT_URL: http://localhost:5173
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server deps
        working-directory: server
        run: npm install

      - name: Install client deps
        working-directory: client
        run: npm install

      - name: Run DB migrations
        working-directory: server
        run: npm run migrate

      - name: Install Playwright + Chromium
        run: npx --yes @playwright/test install --with-deps chromium

      - name: Start server
        working-directory: server
        run: |
          nohup npm run dev > server.log 2>&1 &
          npx --yes wait-on http://localhost:4000/health --timeout 30000

      - name: Start client
        working-directory: client
        run: |
          echo "VITE_API_URL=http://localhost:4000" > .env
          nohup npm run dev -- --host > client.log 2>&1 &
          npx --yes wait-on http://localhost:5173 --timeout 30000

      - name: Run Playwright E2E tests
        run: npx --yes @playwright/test test
        env:
          E2E_BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Print server logs on failure
        if: failure()
        run: cat server/server.log
